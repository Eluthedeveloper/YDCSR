services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-ydcs_radio_home}
      MYSQL_USER: ${DB_USER:-ydcs}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ydcs_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ydcs

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-ydcs}
      DB_PASSWORD: ${DB_PASSWORD:-ydcs_password}
      DB_NAME: ${DB_NAME:-ydcs_radio_home}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      BACKUP_CRON: ${BACKUP_CRON:-off}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    expose:
      - "5000"
    networks:
      - ydcs

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ydcs

volumes:
  mysql_data:
  uploads_data:
  backups_data:

networks:
  ydcs:
    driver: bridge
